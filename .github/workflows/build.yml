name: Cockpit nativo
on:
  workflow_dispatch:
  push:
    branches: [main, dev/cockpit-nativo]
    paths-ignore: ['review/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['review/**', '**.md']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verificar recursos da interface
        run: |
          test ! -d app/src/main/assets
          if grep -RE 'android.webkit|WebView' app/src/main/java; then exit 1; fi
      - name: Compilar e testar decodificadores
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Habilitar aceleração KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: bash tests/device.sh
      - name: Evidências de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-validacao
          path: |
            evidence/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: APK validado
        uses: actions/upload-artifact@v4
        with:
          name: BMW-Digital-Cockpit-nativo
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
