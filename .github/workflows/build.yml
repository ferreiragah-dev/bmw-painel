name: Build, test and capture

on:
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Optional release-grade signing: provide COCKPIT_KEYSTORE_BASE64 + passwords as repository secrets.
      # Without them the public debug keystore in keystore/ is used, so every CI build has the same signature.
      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.COCKPIT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cockpit.jks"
          echo "COCKPIT_KEYSTORE_FILE=$RUNNER_TEMP/cockpit.jks" >> "$GITHUB_ENV"

      - name: Unit tests, lint and APK
        env:
          COCKPIT_KEYSTORE_PASSWORD: ${{ secrets.COCKPIT_KEYSTORE_PASSWORD }}
          COCKPIT_KEY_ALIAS: ${{ secrets.COCKPIT_KEY_ALIAS }}
          COCKPIT_KEY_PASSWORD: ${{ secrets.COCKPIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Verify APK contains no screen mockups
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | awk '{print $4}' > apk-files.txt
          if grep -Ei '(assets/|res/).*\.(webp|jpg|jpeg)$' apk-files.txt; then echo "Unexpected bitmap assets in APK"; exit 1; fi
          if grep -Ei 'assets/(screens|index\.html)' apk-files.txt; then echo "WebView mockup assets found"; exit 1; fi
          echo "PNG resources in APK:"; grep -Ei '\.png$' apk-files.txt || echo "(none)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BMW-Digital-Cockpit-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            apk-files.txt

  emulator-screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: hu1280x720, size: 1280x720, density: 160, full: 'true' }
          - { name: hu1024x600, size: 1024x600, density: 160, full: 'false' }
          - { name: hu800x480, size: 800x480, density: 160, full: 'false' }
          - { name: hu1280x480, size: 1280x480, density: 160, full: 'false' }
          - { name: ultrawide1920x720, size: 1920x720, density: 160, full: 'false' }
          - { name: portrait, size: 1080x2400, density: 420, full: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run screenshot tour on emulator (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/capture-review.sh ${{ matrix.name }} ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.full }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-screenshots-${{ matrix.name }}
          path: review/ci/
